    <input class="input" [value]="itemsPerPage">
    <div class="svgContainer">
        <svg xmlns="http://www.w3.org/2000/svg" class="iconoPlus" viewBox="0 0 120 120" width="24px" height="24px" baseProfile="basic" (click)="inc()" >
            <path d="M110.214,13.786c-2.343-2.343-6.142-2.343-8.485,0L8.996,106.52l2.033,2.033l-3.238,3.238 l4.242,4.242l3.238-3.238l2.209,2.209l92.734-92.733C112.557,19.928,112.557,16.129,110.214,13.786z" opacity=".35"/>

    <div class="paginationContainer">
        
        <pagination-controls
            class="miPaginacion"
            (pageChange)="p = $event"
            previousLabel="Anterior"
            nextLabel="Siguiente"
            screenReaderPaginationLabel="Paginación"
            screenReaderPageLabel="Página"
            screenReaderCurrentLabel="Página actual">
        </pagination-controls>
    </div> 
    
</nav>

<main class="row g-2 mb-2">
    @for(usuario of arrayUsers 
    | paginate: { itemsPerPage: itemsPerPage, currentPage: p }; 
    track usuario._id) {
        <article class="col-12 col-md-6 col-lg-4 mt-5">
            <app-usuario-card [miUser]="usuario"></app-usuario-card>
        </article>
    }
    @empty {
        <h1>No hay nada</h1>
    }
</main>
